function updateVersionBadge() {
  const b = document.getElementById('verBtn'); if (!b) return;
  b.innerHTML = 'v' + APP_VERSION + (loadStorage('qs_seen_version', '') !== APP_VERSION ? '<span class="nd"></span>' : '');
}
function openChangelog() {
  saveStorage('qs_seen_version', APP_VERSION); updateVersionBadge();
  const b = document.getElementById('clBody');
  b.innerHTML = `<h3>✿ ${t('clTitle')}</h3>` + CHANGELOG.map((e, i) =>
    `<div class="cl-e"><div class="cl-h"><span class="cl-v">v${e.v}</span>${i === 0 ? `<span class="chip pink">${t('clNow')}</span>` : ''}<span class="cl-d">${e.date}</span></div><ul>${(e[lang] || e.nl).map(x => `<li>${x}</li>`).join('')}</ul></div>`).join('') +
    `<div class="s-foot"><button class="btn ghost" onclick="closeSheet('clSheet')">${t('close')}</button></div>`;
  openSheet('clSheet');
}

/* ---------------- PWA (petal icon) ---------------- */
function setupPWA() {
  try {
    const icon = s => {
      const c = document.createElement('canvas'); c.width = c.height = s;
      const x = c.getContext('2d');
      x.fillStyle = '#171317'; x.fillRect(0, 0, s, s);
      const cx = s / 2, cy = s / 2, r = s * 0.155;
      x.fillStyle = '#ff7a9e';
      for (let i = 0; i < 5; i++) {
        const a = i / 5 * Math.PI * 2 - Math.PI / 2;
        x.beginPath(); x.ellipse(cx + Math.cos(a) * r * 1.4, cy + Math.sin(a) * r * 1.4, r, r * 0.74, a, 0, Math.PI * 2); x.fill();
      }
      x.fillStyle = '#ffb057'; x.beginPath(); x.arc(cx, cy, r * 0.6, 0, Math.PI * 2); x.fill();
      return c.toDataURL('image/png');
    };
    const manifest = {
      name: 'QS·Insights', short_name: 'QS·Insights',
      start_url: location.href.split('#')[0],
      scope: location.href.replace(/[^/]*$/, ''),
      display: 'standalone', background_color: '#171216', theme_color: '#171216',
      icons: [{ src: icon(192), sizes: '192x192', type: 'image/png' },
              { src: icon(512), sizes: '512x512', type: 'image/png' },
              { src: icon(512), sizes: '512x512', type: 'image/png', purpose: 'maskable' }]
    };
    const link = document.createElement('link');
    link.rel = 'manifest';
    link.href = 'data:application/manifest+json,' + encodeURIComponent(JSON.stringify(manifest));
    document.head.appendChild(link);
    const apple = document.createElement('link'); apple.rel = 'apple-touch-icon'; apple.href = icon(180);
    document.head.appendChild(apple);
  } catch (e) {}
}

/* ---------------- render + init ---------------- */
function render() {
  renderKpis();
  renderChart();
  renderTops();
  renderActivity();
  updateOpsTiles();
  renderRecentList();
  updateStaleBanner();
  updateSyncStatus();
  updateVersionBadge();
}
async function init() {
  lang = loadStorage('qs_lang', 'nl');
  const th = loadStorage('qs_theme', 'dark');
  document.documentElement.setAttribute('data-theme', th);
  const tb = document.getElementById('themeBtn'); if (tb) tb.textContent = th === 'dark' ? '☀' : '☾';
  const lb = document.getElementById('langBtn'); if (lb) lb.textContent = lang === 'nl' ? 'EN' : 'NL';
  applyStatic();
  if (window.Chart) {
    Chart.defaults.color = '#9a8b8e';
    Chart.defaults.borderColor = 'rgba(154,139,142,0.16)';
    Chart.defaults.font.family = "'Manrope', system-ui, sans-serif";
  }
  try {
    const csv = await loadTransactionsCsv();
    if (csv) { lastCsvText = csv; allTransactions = parseCSV(csv); rebuildAnalyticsSet(); transactions = applyDateFilter(analyticsAll); }
  } catch (e) {}
  try {
    const remote = await pullState(canWrite());
    if (remote) { applyState(mergeStates(remote, gatherState())); migrateStockKeys(); }
  } catch (e) {}
  render();
  startSharedPolling();
  document.addEventListener('visibilitychange', () => { if (!document.hidden) pollOnce(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeTopSheet(); });
  setupPWA();
  loadBlossomItems();
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
else init();
</script>
