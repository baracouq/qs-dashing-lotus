<!DOCTYPE html>
<html lang="nl" data-theme="dark">
<head>
<meta charset="utf-8" />
<title>QS·Insights — Blossom lotus shop</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#171216" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="QS·Insights" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #171216; --bg2: #1c161b; --card: #211a20; --card2: #2a2129;
    --line: rgba(255, 236, 235, 0.09); --line2: rgba(255, 236, 235, 0.16);
    --ink: #f7efe9; --ink2: #c2b4b1; --ink3: #837576;
    --pink: #ff7a9e; --pink2: #ff9db8; --peach: #ffb057; --mint: #3ddc97; --sky: #6db8ff; --rose: #ff6470; --amber: #e8a13c;
    --pink-soft: rgba(255,122,158,.14); --mint-soft: rgba(61,220,151,.13); --rose-soft: rgba(255,100,112,.13); --amber-soft: rgba(232,161,60,.15); --sky-soft: rgba(109,184,255,.13);
    --font: 'Manrope', system-ui, sans-serif; --mono: 'JetBrains Mono', ui-monospace, monospace;
    --r: 22px; --shadow: 0 14px 40px rgba(10, 5, 9, 0.45);
    color-scheme: dark;
  }
  [data-theme="light"] {
    --bg: #faf5ef; --bg2: #f3ece4; --card: #fffdf9; --card2: #f2e9e2;
    --line: rgba(60, 34, 40, 0.10); --line2: rgba(60, 34, 40, 0.18);
    --ink: #2b1e22; --ink2: #6d5a5e; --ink3: #a08e91;
    --pink: #e75f88; --pink2: #d94f79; --peach: #e08c2b; --mint: #159d68; --sky: #2b7cc9; --rose: #d43a47; --amber: #b06f14;
    --pink-soft: rgba(231,95,136,.12); --mint-soft: rgba(21,157,104,.12); --rose-soft: rgba(212,58,71,.10); --amber-soft: rgba(176,111,20,.13); --sky-soft: rgba(43,124,201,.11);
    --shadow: 0 12px 34px rgba(80, 50, 55, 0.12);
    color-scheme: light;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: var(--font); background: var(--bg); color: var(--ink); font-size: 14.5px; line-height: 1.5;
    padding: 12px 14px 96px; -webkit-font-smoothing: antialiased; transition: background .25s, color .25s;
  }
  body.noscroll { overflow: hidden; }
  ::selection { background: rgba(255,122,158,.35); }
  .wrap { max-width: 980px; margin: 0 auto; position: relative; }
  .mono { font-family: var(--mono); }
  b { font-weight: 700; }

  /* petals */
  .petal { position: fixed; top: -30px; color: var(--pink); opacity: .13; pointer-events: none; z-index: 0; font-size: 22px; animation: fall linear infinite; }
  .petal.p1 { left: 12%; animation-duration: 21s; }
  .petal.p2 { left: 55%; animation-duration: 27s; animation-delay: 6s; font-size: 16px; }
  .petal.p3 { left: 84%; animation-duration: 24s; animation-delay: 12s; font-size: 19px; }
  @keyframes fall { from { transform: translateY(-5vh) rotate(0deg); } to { transform: translateY(110vh) rotate(300deg); } }
  @media (prefers-reduced-motion: reduce) { .petal { display: none; } }

  /* command bar */
  .cmd { position: sticky; top: 0; z-index: 40; display: flex; align-items: center; gap: 10px; padding: 10px 2px; margin: -12px -2px 8px;
    background: color-mix(in srgb, var(--bg) 82%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
  .mark { display: flex; align-items: baseline; gap: 8px; margin-right: auto; min-width: 0; }
  .mark .flower { color: var(--pink); font-size: 20px; line-height: 1; }
  .mark .name { font-weight: 800; font-size: 18px; letter-spacing: -0.3px; white-space: nowrap; }
  .mark .name i { font-style: normal; color: var(--pink); }
  .ver { font-family: var(--mono); font-size: 10px; color: var(--ink3); background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 2px 8px; cursor: pointer; position: relative; }
  .ver .nd { position: absolute; top: -3px; right: -3px; width: 7px; height: 7px; border-radius: 50%; background: var(--rose); }
  .ib { background: var(--card); border: 1px solid var(--line); color: var(--ink2); border-radius: 999px; padding: 8px 12px; font-family: var(--font); font-weight: 700; font-size: 12px; cursor: pointer; white-space: nowrap; transition: .15s; -webkit-appearance: none; }
  .ib:hover { border-color: var(--pink); color: var(--ink); }
  .ib.on { border-color: var(--mint); color: var(--mint); }

  .meta { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; font-size: 11.5px; color: var(--ink3); margin: 2px 2px 12px; }
  .sync { display: flex; align-items: center; gap: 6px; }
  .sync .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ink3); }
  .sync.live .dot { background: var(--mint); box-shadow: 0 0 8px var(--mint); }
  .sync.ro .dot { background: var(--sky); }
  .sync.push .dot { background: var(--peach); }
  .sync.err .dot { background: var(--rose); }
  .data-age { display: none; align-items: center; gap: 5px; }

  .stale { display: none; align-items: center; gap: 8px; background: var(--amber-soft); border: 1px solid var(--amber); color: var(--amber);
    border-radius: 16px; padding: 10px 13px; margin: 0 0 12px; font-weight: 600; font-size: 12.5px; }

  /* period pills */
  .pfrow { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding: 2px; margin: 0 -2px 14px; }
  .pfrow::-webkit-scrollbar { display: none; }
  .pf { background: var(--card); border: 1px solid var(--line); color: var(--ink2); border-radius: 999px; padding: 8px 14px; font-family: var(--font); font-weight: 700; font-size: 12.5px; cursor: pointer; white-space: nowrap; transition: .15s; -webkit-appearance: none; }
  .pf.on { background: var(--pink); border-color: var(--pink); color: #33101d; }

  /* bento */
  .bento { display: grid; grid-template-columns: 1fr; gap: 12px; position: relative; z-index: 1; }
  .tile { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; box-shadow: var(--shadow); position: relative; }
  .tt { font-weight: 800; font-size: 13px; letter-spacing: .2px; color: var(--ink2); margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
  .tt .n { color: var(--ink3); font-weight: 600; }
  @media (min-width: 760px) {
    .bento { grid-template-columns: repeat(6, 1fr); }
    .t-hero { grid-column: span 3; grid-row: span 2; }
    .t-kpi { grid-column: span 3; }
    .t-chart { grid-column: span 6; }
    .t-items, .t-buyers, .t-ops, .t-act { grid-column: span 3; }
    .t-recent { grid-column: span 6; }
  }

  /* hero + kpis */
  .t-hero { display: flex; flex-direction: column; overflow: hidden; }
  .t-hero::after { content: '✿'; position: absolute; right: 12px; top: 6px; font-size: 52px; color: var(--pink); opacity: .07; }
  .eyebrow { font-size: 11px; font-weight: 800; letter-spacing: .6px; color: var(--pink); text-transform: uppercase; }
  .hero-big { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin: 6px 0 4px; }
  .hero-big span#heroNet { font-weight: 800; font-size: clamp(40px, 10vw, 54px); letter-spacing: -1.2px; line-height: 1; font-variant-numeric: tabular-nums; }
  .hero-sub { font-size: 12.5px; color: var(--ink2); margin-top: auto; padding-top: 8px; }
  #spark { width: 100%; height: 54px; display: block; margin-top: 6px; }
  .k-l { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 11.5px; font-weight: 700; color: var(--ink2); }
  .k-v { font-weight: 800; font-size: 30px; letter-spacing: -0.5px; margin-top: 4px; font-variant-numeric: tabular-nums; }
  .k-s { font-size: 10.5px; color: var(--ink3); margin-top: 2px; }
  .pill { display: inline-flex; align-items: center; gap: 3px; font-size: 11px; font-weight: 800; padding: 2px 9px; border-radius: 999px; white-space: nowrap; }
  .pill.up { color: var(--mint); background: var(--mint-soft); }
  .pill.down { color: var(--rose); background: var(--rose-soft); }
  .pill.flat { color: var(--ink3); background: var(--card2); }

  .chartbox { position: relative; height: 190px; }

  /* lists */
  .li { display: flex; align-items: center; gap: 11px; padding: 9px 0; border-bottom: 1px solid var(--line); }
  .li:last-child { border-bottom: 0; }
  .li.click { cursor: pointer; margin: 0 -8px; padding: 9px 8px; border-radius: 12px; transition: background .12s; }
  .li.click:hover { background: var(--card2); }
  .li .m { flex: 1; min-width: 0; }
  .li .m .a { font-weight: 700; font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .li .m .b { font-size: 11px; color: var(--ink3); margin-top: 1px; }
  .li .amt { font-weight: 800; color: var(--mint); font-size: 13px; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .icon-img { width: 26px; height: 26px; image-rendering: pixelated; border-radius: 6px; flex-shrink: 0; background: var(--card2); }
  .avatar { width: 26px; height: 26px; image-rendering: pixelated; border-radius: 7px; flex-shrink: 0; background: var(--card2); }
  .bar { height: 7px; border-radius: 999px; background: var(--card2); overflow: hidden; margin-top: 6px; }
  .bar i { display: block; height: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--pink), var(--peach)); }
  .chip { display: inline-flex; align-items: center; font-size: 10px; font-weight: 800; padding: 2px 8px; border-radius: 999px; }
  .chip.green { color: var(--mint); background: var(--mint-soft); }
  .chip.amber { color: var(--amber); background: var(--amber-soft); }
  .chip.red { color: var(--rose); background: var(--rose-soft); }
  .chip.gray { color: var(--ink3); background: var(--card2); }
  .chip.pink { color: var(--pink); background: var(--pink-soft); }
  .badge { display: inline-flex; font-size: 10px; font-weight: 800; padding: 1px 7px; border-radius: 999px; }

  /* activity mini */
  .abars { display: flex; align-items: flex-end; gap: 6px; height: 74px; margin: 8px 0 6px; }
  .ab { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .ab i { width: 100%; border-radius: 6px 6px 3px 3px; background: var(--card2); min-height: 3px; }
  .ab.top i { background: linear-gradient(180deg, var(--pink), var(--peach)); }
  .ab s { text-decoration: none; font-size: 9.5px; color: var(--ink3); font-weight: 700; }
  .act-line { font-size: 12px; color: var(--ink2); }

  /* ops */
  .ops { display: grid; gap: 10px; }
  .opbtn { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; background: var(--card2); border: 1px solid var(--line); border-radius: 16px; padding: 13px 14px; cursor: pointer; color: var(--ink); font-family: var(--font); transition: .15s; -webkit-appearance: none; }
  .opbtn:hover { border-color: var(--pink); transform: translateY(-1px); }
  .opbtn .ic { font-size: 20px; }
  .opbtn .tx { flex: 1; min-width: 0; }
  .opbtn .tx .a { font-weight: 800; font-size: 13.5px; }
  .opbtn .tx .b { font-size: 11.5px; color: var(--ink3); margin-top: 1px; }
  .opbtn .go { color: var(--ink3); font-weight: 800; }

  .search { width: 100%; background: var(--bg2); border: 1px solid var(--line); border-radius: 14px; padding: 11px 13px; color: var(--ink); font-family: var(--font); font-size: 13.5px; margin-bottom: 10px; }
  .search:focus { outline: none; border-color: var(--pink); box-shadow: 0 0 0 3px var(--pink-soft); }

  .btn { background: var(--pink); border: 1px solid var(--pink); color: #33101d; border-radius: 13px; padding: 11px 15px; font-family: var(--font); font-weight: 800; font-size: 13px; cursor: pointer; -webkit-appearance: none; transition: .15s; white-space: nowrap; }
  .btn:hover { background: var(--pink2); border-color: var(--pink2); }
  .btn.ghost { background: transparent; border-color: var(--line2); color: var(--ink2); }
  .btn.ghost:hover { border-color: var(--pink); color: var(--ink); }
  .btn.danger { background: transparent; border-color: var(--rose); color: var(--rose); }
  .btn.sm { padding: 8px 11px; font-size: 12px; border-radius: 11px; }
  .btn.wide { width: 100%; }

  footer { margin: 26px 2px 6px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; color: var(--ink3); font-size: 11.5px; }
  footer .sp { margin-left: auto; }

  /* bottom nav */
  .bnav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 45; display: flex; justify-content: space-around; padding: 8px 8px calc(8px + env(safe-area-inset-bottom));
    background: color-mix(in srgb, var(--bg) 80%, transparent); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border-top: 1px solid var(--line); }
  .bnav button { background: none; border: none; color: var(--ink3); font-family: var(--font); font-size: 10.5px; font-weight: 700; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 4px 10px; -webkit-appearance: none; }
  .bnav button .i { font-size: 18px; }
  .bnav button:hover, .bnav button.on { color: var(--pink); }
  @media (min-width: 760px) { .bnav { display: none; } body { padding-bottom: 40px; } }

  /* sheets */
  .sheet-bg { position: fixed; inset: 0; z-index: 60; background: rgba(14, 8, 12, 0.55); backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px); display: flex; align-items: flex-end; justify-content: center; opacity: 0; pointer-events: none; transition: opacity .22s; }
  .sheet-bg.open { opacity: 1; pointer-events: auto; }
  .sheet { width: 100%; max-width: 640px; max-height: 88vh; overflow-y: auto; background: var(--card); border: 1px solid var(--line); border-bottom: none; border-radius: 26px 26px 0 0; padding: 10px 18px calc(20px + env(safe-area-inset-bottom)); transform: translateY(103%); transition: transform .28s cubic-bezier(.32,.72,.28,1); }
  .sheet-bg.open .sheet { transform: translateY(0); }
  .handle { width: 42px; height: 4px; border-radius: 999px; background: var(--line2); margin: 4px auto 14px; }
  .sheet h3 { font-size: 17px; font-weight: 800; letter-spacing: -0.2px; margin-bottom: 4px; display: flex; align-items: center; gap: 8px; }
  .sheet .desc { font-size: 12.5px; color: var(--ink2); margin-bottom: 12px; }
  .s-foot { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }
  .in { width: 100%; background: var(--bg2); border: 1px solid var(--line); border-radius: 13px; padding: 11px 13px; color: var(--ink); font-family: var(--font); font-size: 14px; margin: 4px 0 10px; }
  .in:focus { outline: none; border-color: var(--pink); box-shadow: 0 0 0 3px var(--pink-soft); }
  label { font-size: 11.5px; font-weight: 800; color: var(--ink2); }
  .err { color: var(--rose); font-size: 12px; min-height: 16px; font-weight: 700; }
  .divider { height: 1px; background: var(--line); margin: 16px 0; }

  /* stock & loan cards in sheets */
  .scard { background: var(--card2); border: 1px solid var(--line); border-left: 3px solid var(--line2); border-radius: 16px; padding: 12px; margin-bottom: 10px; }
  .scard.low { border-left-color: var(--amber); }
  .scard.urgent { border-left-color: var(--rose); }
  .s-top { display: flex; align-items: center; gap: 10px; }
  .s-info { flex: 1; min-width: 0; }
  .s-name { font-weight: 800; font-size: 13.5px; }
  .s-co { font-size: 10px; color: var(--ink3); }
  .s-est { text-align: right; }
  .s-num { font-weight: 800; font-size: 24px; line-height: 1; font-variant-numeric: tabular-nums; }
  .s-num.low { color: var(--amber); } .s-num.urgent { color: var(--rose); }
  .s-cap { font-size: 9.5px; color: var(--ink3); font-weight: 700; }
  .s-meta { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 8px; font-size: 10.5px; color: var(--ink3); }
  .s-act { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
  .s-act .btn { flex: 1; }
  .s-act .btn.danger { flex: 0 0 auto; }

  .lsec { margin-top: 14px; }
  .lsec h4 { font-size: 11px; font-weight: 800; letter-spacing: .6px; text-transform: uppercase; color: var(--ink3); display: flex; align-items: center; gap: 6px; margin-bottom: 8px; }
  .lsec h4 .d { width: 7px; height: 7px; border-radius: 50%; }
  .lcard { background: var(--card2); border: 1px solid var(--line); border-left: 3px solid var(--line2); border-radius: 16px; padding: 12px; margin-bottom: 9px; }
  .lcard.overdue { border-left-color: var(--rose); }
  .lcard.active { border-left-color: var(--mint); }
  .lcard.returned { opacity: .55; }
  .l-top { display: flex; align-items: center; gap: 9px; }
  .l-who { font-weight: 800; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .l-amt { font-weight: 800; color: var(--peach); font-variant-numeric: tabular-nums; }
  .l-item { display: flex; align-items: center; gap: 7px; font-size: 12.5px; margin: 7px 0; }
  .l-line { display: flex; justify-content: space-between; gap: 8px; font-size: 11px; color: var(--ink3); }
  .l-line .st { font-weight: 800; }
  .l-line .st.late { color: var(--rose); }
  .l-note { margin-top: 7px; font-size: 11.5px; color: var(--ink2); background: var(--bg2); border-radius: 10px; padding: 7px 9px; }
  .l-act { display: flex; gap: 6px; margin-top: 10px; }
  .l-act .btn { flex: 1; }
  .l-act .btn.danger { flex: 0 0 auto; }

  .empty { text-align: center; padding: 34px 16px; color: var(--ink2); }
  .empty .fx { font-size: 40px; margin-bottom: 6px; }
  .empty .h { font-size: 11.5px; color: var(--ink3); margin-top: 5px; }

  .toast { position: fixed; left: 50%; bottom: 84px; transform: translateX(-50%) translateY(16px); z-index: 90; background: var(--card); border: 1px solid var(--line2); color: var(--ink); padding: 11px 16px; border-radius: 999px; font-weight: 700; font-size: 13px; opacity: 0; transition: .22s; box-shadow: var(--shadow); pointer-events: none; max-width: 90vw; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast.green { border-color: var(--mint); color: var(--mint); }
  .toast.red { border-color: var(--rose); color: var(--rose); }
  .toast.amber { border-color: var(--amber); color: var(--amber); }

  .cl-e { padding: 12px 0; border-bottom: 1px solid var(--line); }
  .cl-e:last-child { border: 0; }
  .cl-h { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .cl-v { font-weight: 800; color: var(--pink); }
  .cl-d { margin-left: auto; font-size: 11px; color: var(--ink3); }
  .cl-e ul { padding-left: 18px; }
  .cl-e li { font-size: 12.5px; color: var(--ink2); margin: 4px 0; }
</style>
</head>
<body>
<span class="petal p1">✿</span><span class="petal p2">✿</span><span class="petal p3">✿</span>
<div class="wrap">

  <div class="cmd">
    <div class="mark"><span class="flower">✿</span><span class="name">QS<i>·</i>Insights</span><button class="ver" id="verBtn" onclick="openChangelog()">v3.0</button></div>
    <button class="ib" id="lockBtn" onclick="toggleLock()">🔒</button>
    <button class="ib" id="langBtn" onclick="toggleLang()">EN</button>
    <button class="ib" onclick="toggleTheme()" id="themeBtn">☀</button>
    <button class="ib" onclick="openSettings()">⚙</button>
  </div>

  <div class="meta">
    <div class="sync ro" id="sync"><span class="dot"></span><span id="syncText"></span></div>
    <div class="data-age" id="dataAgeWrap">🕒 <span id="dataAge"></span></div>
  </div>

  <div class="stale" id="staleBanner"></div>

  <div class="pfrow" id="pfrow">
    <button class="pf" data-r="1d" onclick="setDateFilter('1d')"></button>
    <button class="pf on" data-r="7d" onclick="setDateFilter('7d')"></button>
    <button class="pf" data-r="30d" onclick="setDateFilter('30d')"></button>
    <button class="pf" data-r="90d" onclick="setDateFilter('90d')"></button>
    <button class="pf" data-r="all" onclick="setDateFilter('all')"></button>
    <button class="pf" data-r="custom" onclick="openRange()"></button>
  </div>

  <div class="bento">
    <div id="kpiHero" class="tile t-hero"></div>
    <div id="kpiA" class="tile t-kpi"></div>
    <div id="kpiB" class="tile t-kpi"></div>
    <div class="tile t-chart"><div class="tt" id="chartTitle"></div><div class="chartbox"><canvas id="revChart"></canvas></div></div>
    <div class="tile t-items"><div class="tt" id="itemsTitle"></div><div id="topItems"></div></div>
    <div class="tile t-buyers"><div class="tt" id="buyersTitle"></div><div id="topBuyers"></div></div>
    <div class="tile t-ops"><div class="tt" id="opsTitle"></div><div class="ops" id="opsBox"></div></div>
    <div class="tile t-act"><div class="tt" id="actTitle"></div><div id="actBox"></div></div>
    <div class="tile t-recent" id="recentTile"><div class="tt" id="recentTitle"></div>
      <input class="search" id="recentSearch" oninput="recentSearchInput(this.value)" />
      <div id="recentList"></div>
    </div>
  </div>

<script>
/* ================ PORTED CORE (bewezen motor uit v1–v2.1) ================ */
function estimateTimezone(txs) {
  const hours = Array(24).fill(0);
  txs.forEach(t => hours[new Date(t.time).getHours()]++);
  const n = txs.length;
  if (!n) return null;
  let sx = 0, sy = 0;
  for (let h = 0; h < 24; h++) { if (!hours[h]) continue; const a = h / 24 * 2 * Math.PI; sx += hours[h] * Math.cos(a); sy += hours[h] * Math.sin(a); }
  const R = Math.sqrt(sx * sx + sy * sy) / n;          // 0..1 concentration of activity
  let ang = Math.atan2(sy, sx); if (ang < 0) ang += 2 * Math.PI;
  const peakAms = ang / (2 * Math.PI) * 24;            // fractional peak hour (your clock)
  let offset = 20 - peakAms;                            // assume local evening peak ~20:00
  offset = ((offset % 24) + 24) % 24; if (offset >= 12) offset -= 24;  // normalize to range -12..+12
  let conf;
  if (n < 4 || R < 0.25) conf = { label: t('confLow'), cls: 'gray' };
  else if (n >= 8 && R >= 0.5) conf = { label: t('confFair'), cls: 'green' };
  else conf = { label: t('confRough'), cls: 'amber' };
  return { hours, n, R, peakAms, offset, region: regionForOffset(offset), conf };
}
function regionForOffset(o) {
  if (o >= -1.5 && o <= 1.5) return { flag: '🇪🇺', label: t('regEU'), sub: t('regEUsub') };
  if (o > 1.5 && o <= 4) return { flag: '🌍', label: t('regEEast'), sub: t('regEEastSub') };
  if (o > 4 && o <= 8.5) return { flag: '🌏', label: t('regAsia'), sub: t('regAsiaSub') };
  if (o > 8.5 || o <= -10.5) return { flag: '🌏', label: t('regOcea'), sub: t('regOceaSub') };
  if (o < -1.5 && o >= -4.5) return { flag: '🌍', label: t('regWEur'), sub: t('regWEurSub') };
  return { flag: '🌎', label: t('regAmer'), sub: t('regAmerSub') };
}
function tzOffsetText(offset) {
  const r = Math.round(offset);
  if (r === 0) return t('tzSameTime');
  return r < 0 ? t('tzBehind', -r) : t('tzAhead', r);
}

let _syncTimer = null;

function b64encode(str) { return btoa(unescape(encodeURIComponent(str))); }

function deriveRepo() {
  const override = loadStorage('qs_repo_override', '');
  if (override) return override;
  try {
    const owner = location.hostname.split('.')[0];
    const parts = location.pathname.split('/').filter(Boolean);
    const repo = parts[0] || (owner + '.github.io');
    if (owner && repo) return owner + '/' + repo;
  } catch (e) {}
  return '';
}

function mergeLoans(a, b) {
  const byId = {};
  [...(a || []), ...(b || [])].forEach(l => {
    if (!l || !l.id) return;
    const prev = byId[l.id];
    if (!prev || new Date(l.mod || 0).getTime() >= new Date(prev.mod || 0).getTime()) byId[l.id] = l;
  });
  return Object.values(byId);
}

function loadStorage(key, fb) { try { const v = localStorage.getItem(key); return v == null ? fb : JSON.parse(v); } catch (e) { return fb; } }

function rawUrl(repo, branch, path) { return `https://raw.githubusercontent.com/${repo}/${branch}/${path}?t=${Date.now()}`; }

async function readPublicJson(path) {
  const repo = getRepo(); if (!repo) return null;

  }

function ghHeaders(token) { return { 'Authorization': 'token ' + token, 'Accept': 'application/vnd.github+json' }; }

async function getSha(path, branch) {
  const repo = getRepo(), token = getEditToken();
  try { const r = await fetch(`${GH_API}/repos/${repo}/contents/${path}?ref=${branch}&t=${Date.now()}`, { headers: ghHeaders(token), cache: 'no-store' }); if (r.ok) return (await r.json()).sha; } catch (e) {}
  return null;
}

async function writeJson(path, obj, message) {
  const repo = getRepo(), token = getEditToken();
  if (!repo || !token) throw new Error('Geen schrijf-toegang');
  const branch = getWriteBranch();
  const sha = await getSha(path, branch);
  const body = { message: message || ('update ' + path), content: b64encode(JSON.stringify(obj, null, 2)), branch };
  if (sha) body.sha = sha;
  const r = await fetch(`${GH_API}/repos/${repo}/contents/${path}`, { method: 'PUT', headers: { ...ghHeaders(token), 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  if (!r.ok) { const err = new Error('GitHub ' + r.status + ': ' + (await r.text()).slice(0, 120)); err.status = r.status; throw err; }
  return await r.json();
}

function _b64(buf) { return btoa(String.fromCharCode(...new Uint8Array(buf))); }

function _unb64(str) { return Uint8Array.from(atob(str), c => c.charCodeAt(0)); }

async function _deriveKey(password, salt) {
  const enc = new TextEncoder();
  const baseKey = await crypto.subtle.importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', salt, iterations: 150000, hash: 'SHA-256' }, baseKey, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
}

async function encryptToken(token, password) {
  const salt = crypto.getRandomValues(new Uint8Array(16));
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const key = await _deriveKey(password, salt);
  const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, new TextEncoder().encode(token));
  return { v: 1, salt: _b64(salt), iv: _b64(iv), ct: _b64(ct) };
}

async function decryptToken(blob, password) {
  const key = await _deriveKey(password, _unb64(blob.salt));
  const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: _unb64(blob.iv) }, key, _unb64(blob.ct));
  return new TextDecoder().decode(pt);
}

function canWrite() { return !!(getRepo() && getEditToken()); }

function getEditToken() { try { return sessionStorage.getItem('qs_edit_token') || ''; } catch (e) { return ''; } }

function ensureUnlocked() {
  if (canWrite()) return true;
  openUnlock();
  return false;
}

function parseCSV(text) {
  const out = [];
  const lines = text.split(/\r?\n/);
  for (let i = 0; i < lines.length; i++) {
    const line = lines[i].trim();
    if (!line) continue;
    const f = line.split(',');
    if (f[0] === 'time' || f[0] === 'timestamp') continue; // header
    if (f.length < 8) continue;
    const time = f[0].trim();
    const buyer = f[1].trim();
    const item = f[2].trim();
    const qty = parseFloat(f[3]) || 0;
    let gross = parseFloat(f[4]); let tax = parseFloat(f[5]); let net = parseFloat(f[6]);
    let shop = f.slice(7).join(',').trim().replace(/^"|"$/g, '');
    if (isNaN(net)) net = isNaN(gross) ? 0 : gross;
    if (isNaN(gross)) gross = net;
    if (isNaN(tax)) tax = 0;
    if (!time || !buyer || !item) continue;
    out.push({ time, buyer, item, qty, gross, tax, net, shop });
  }
  return out;
}

function coordsOf(shop) {
  const m = (shop || '').match(/(-?\d+)[\s,]+(-?\d+)[\s,]+(-?\d+)/);
  return m ? `${m[1]}, ${m[2]}, ${m[3]}` : (shop || 'onbekend');
}

function stockKey(item, shop) { return `${item}@@${coordsOf(shop)}`; }

function slugify(name) {
  const k = (name || '').toLowerCase().trim();
  if (ITEM_SLUG_OVERRIDES[k]) return ITEM_SLUG_OVERRIDES[k];
  return k.replace(/[^a-z0-9]+/g, '_').replace(/^_+|_+$/g, '');
}

function formatRelativeDate(iso) {
  const d = new Date(iso), now = new Date();
  const diff = (now - d) / 1000;
  if (diff < 60) return t('relNow');
  if (diff < 3600) return t('relMin', Math.floor(diff / 60));
  if (diff < 86400) return t('relHour', Math.floor(diff / 3600));
  const days = Math.floor(diff / 86400);
  if (days === 1) return t('relYesterday');
  if (days < 7) return t('relDay', days);
  if (days < 31) return t('relWeek', Math.floor(days / 7));
  return d.toLocaleDateString(dloc(), { day: 'numeric', month: 'short' });
}

function startOfDay(d) { const x = new Date(d); x.setHours(0, 0, 0, 0); return x.getTime(); }

function sumNet(txs) { return txs.reduce((s, t) => s + t.net, 0); }

function getStockData() { return loadStorage('qs_stock_data', {}); }

function saveStockData(all) { saveStorage('qs_stock_data', all); }

function buildStockCombos() {
  const combos = {};
  const src = allTransactions.length ? allTransactions : transactions;
  src.forEach(t => {
    if (isBuyShopItem(t.item)) return;   // buy shops are not sell-stock
    const key = stockKey(t.item, t.shop);
    if (!combos[key]) combos[key] = { key, item: t.item, shop: t.shop, coords: coordsOf(t.shop), totalQty: 0, txs: [] };
    combos[key].totalQty += t.qty;
    combos[key].txs.push(t);
  });
  return combos;
}

function latestSaleTime(combo) { let m = 0; combo.txs.forEach(t => { const x = new Date(t.time).getTime(); if (x > m) m = x; }); return m; }

function estimateStock(entry, combo) {
  if (!entry || entry.baseline == null) return null;
  return Math.max(0, entry.baseline - soldSince(entry.baselineTime, combo));
}

function isShopDeleted(entry, combo) { return !!(entry && entry.deletedAt && latestSaleTime(combo) <= new Date(entry.deletedAt).getTime()); }

function stockConfidence(entry) {
  if (!entry || !entry.baselineTime) return { label: t('confEstimate'), cls: 'amber' };
  const ageDays = (Date.now() - new Date(entry.baselineTime).getTime()) / 86400000;
  if ((entry.lastType === 'recount' || entry.lastType === 'fill' || entry.lastType === 'set') && ageDays < 1) return { label: t('confMeasured'), cls: 'green' };
  if (ageDays > 14) return { label: t('confStale'), cls: 'gray' };
  return { label: t('confEstimate'), cls: 'amber' };
}

function migrateStockKeys() {
  const all = getStockData();
  let changed = false; const out = {};
  Object.keys(all).forEach(oldKey => {
    const entry = all[oldKey];
    const sep = oldKey.indexOf('@@');
    let newKey = oldKey;
    if (sep !== -1) {
      const item = oldKey.slice(0, sep);
      const coords = coordsOf(oldKey.slice(sep + 2));
      if (coords && coords !== 'onbekend') newKey = `${item}@@${coords}`;
    }
    if (newKey !== oldKey) changed = true;
    if (out[newKey]) {
      const a = out[newKey], b = entry;
      const at = new Date(a.baselineTime || 0).getTime(), bt = new Date(b.baselineTime || 0).getTime();
      const w = bt >= at ? { ...b } : { ...a };
      w.capacity = Math.max(a.capacity || 0, b.capacity || 0) || undefined;
      const dMax = Math.max(new Date(a.deletedAt || 0).getTime(), new Date(b.deletedAt || 0).getTime());
      w.deletedAt = dMax > 0 ? new Date(dMax).toISOString() : undefined;
      const seen = new Set();
      w.history = [...(a.history || []), ...(b.history || [])]
        .filter(h => { const k = h.t + h.type; if (seen.has(k)) return false; seen.add(k); return true; })
        .sort((x, y) => new Date(x.t) - new Date(y.t)).slice(-30);
      out[newKey] = w;
    } else out[newKey] = entry;
  });
  if (changed) saveStockData(out);
  return changed;
}

function getLoans() { const l = loadStorage('qs_loans', []); return Array.isArray(l) ? l : []; }

function saveLoans(l) { saveStorage('qs_loans', l); }

function _updateLoan(id, changes) {
  const all = getLoans();

  all[i] = { ...all[i], ...changes, mod: new Date().toISOString() };
  saveLoans(all); triggerSync();
}

function activeLoans() { return getLoans().filter(l => l && !l.del); }

function loanStatus(loan) {
  if (loan.returnedAt) return 'returned';
  return Date.now() > loanDueMs(loan) ? 'overdue' : 'active';
}

function loanDueMs(loan) { return new Date(loan.start).getTime() + (Number(loan.days) || 0) * 86400000; }

function gatherState() {
  return { v: 2, updated: new Date().toISOString(), stock: getStockData(), notes: loadStorage('qs_cust_notes', {}), loans: getLoans() };
}

function applyState(state) {
  if (!state) return;
  if (state.stock && Object.keys(state.stock).length) saveStockData(state.stock);
  if (state.notes && Object.keys(state.notes).length) saveStorage('qs_cust_notes', state.notes);
  if (Array.isArray(state.loans)) saveLoans(state.loans);
}

function mergeStates(remote, local) {
  remote = remote || {}; local = local || {};
  const rs = remote.stock || {}, ls = local.stock || {};
  const stock = {};
  new Set([...Object.keys(rs), ...Object.keys(ls)]).forEach(k => {
    const a = rs[k], b = ls[k];
    if (a && b) {
      const at = new Date(a.baselineTime || 0).getTime(), bt = new Date(b.baselineTime || 0).getTime();
      const w = bt >= at ? { ...b } : { ...a };
      w.capacity = Math.max(a.capacity || 0, b.capacity || 0) || undefined;
      const dMax = Math.max(new Date(a.deletedAt || 0).getTime(), new Date(b.deletedAt || 0).getTime());
      w.deletedAt = dMax > 0 ? new Date(dMax).toISOString() : undefined;
      const seen = new Set();
      w.history = [...(a.history || []), ...(b.history || [])]
        .filter(h => { const key = h.t + h.type; if (seen.has(key)) return false; seen.add(key); return true; })
        .sort((x, y) => new Date(x.t) - new Date(y.t)).slice(-30);
      stock[k] = w;
    } else stock[k] = a || b;
  });
  const notes = { ...(remote.notes || {}), ...(local.notes || {}) };
  const loans = mergeLoans(remote.loans, local.loans);
  return { v: 2, updated: new Date().toISOString(), stock, notes, loans };
}

async function pullState(authenticated) {
  let remote = null;
  if (authenticated && canWrite()) { const r = await readApiJson('qs_state.json'); remote = r ? r.json : null; }
  if (!remote) remote = await readPublicJson('qs_state.json');
  return remote;
}

async function pushState() {
  if (!canWrite() || syncInFlight) return;
  syncInFlight = true; updateSyncStatus('pushing');
  try {
    for (let attempt = 0; attempt < 4; attempt++) {
      const remote = await pullState(true);          // fresh (cache-busted) base
      const merged = mergeStates(remote, gatherState());
      applyState(merged);
      try {
        await writeJson('qs_state.json', merged, 'update stock state');
        updateSyncStatus();
        return;
      } catch (e) {
        // 409 = someone (or a stale cache) changed the file first.
        // Re-pull the latest, re-merge our change in, and try again.
        if (e.status === 409 && attempt < 3) {
          await new Promise(res => setTimeout(res, 250 * (attempt + 1)));
          continue;
        }
        throw e;
      }
    }
  } catch (e) {
    updateSyncStatus('error');
    showToast(t('syncFailed', e.message), 'red', 3500);
  } finally { syncInFlight = false; }
}

async function loadTransactionsCsv() {
  const repo = getRepo(); if (!repo) return null;
  const branches = [getWriteBranch(), 'main', 'master'].filter((b, i, a) => a.indexOf(b) === i);
  for (const branch of branches) {
    try {
      const r = await fetch(rawUrl(repo, branch, 'transactions_archive.csv'), { cache: 'no-store' });
      if (r.ok) { setWriteBranch(branch); return await r.text(); }
    } catch (e) {}
  }
  return null;
}

async function pollOnce() {
  if (syncInFlight) return;
  try {
    // 1. shared state (stock / loans / notes)
    const beforeStock = JSON.stringify(getStockData());
    const beforeLoans = JSON.stringify(getLoans());
    const remote = await pullState(canWrite());
    if (remote) { applyState(mergeStates(remote, gatherState())); migrateStockKeys(); }
    const stockChanged = JSON.stringify(getStockData()) !== beforeStock;
    const loansChanged = JSON.stringify(getLoans()) !== beforeLoans;

    // 2. transaction data (new sales pushed by the pipeline)
    let txChanged = false;
    const csv = await loadTransactionsCsv();
    if (csv != null && csv !== lastCsvText) {
      lastCsvText = csv;
      allTransactions = parseCSV(csv);
      rebuildAnalyticsSet();
      transactions = applyDateFilter(analyticsAll);
      txChanged = true;
    }

    // 3. reflect changes on screen
    if (txChanged) {
      const sy = window.scrollY;        // keep the viewer's scroll position
      render();                         // refreshes everything
      window.scrollTo(0, sy);
    } else {
      if (stockChanged) { updateOpsTiles(); if (sheetOpen('stockSheet')) renderStockSheet(); }
      if (loansChanged) { updateOpsTiles(); if (sheetOpen('loanSheet')) renderLoanSheet(); }
    }
    updateSyncStatus();
    updateStaleBanner();
  } catch (e) {}
}

function startSharedPolling() {
  if (pollTimer) clearInterval(pollTimer);
  pollTimer = setInterval(() => { if (!document.hidden) pollOnce(); }, 45000);
}

function updateStaleBanner() {
  let newest = 0, newestIso = null;
  allTransactions.forEach(tx => { const m = new Date(tx.time).getTime(); if (m > newest) { newest = m; newestIso = tx.time; } });
  // Always-on freshness stamp in the metabar
  const wrap = document.getElementById('dataAgeWrap');
  if (wrap) {
    if (newest) {
      wrap.style.display = 'flex';
      const sp = document.getElementById('dataAge');
      if (sp) sp.textContent = t('dataAgeLabel', formatRelativeDate(newestIso));
    } else wrap.style.display = 'none';
  }
  // Amber warning banner only when genuinely stale (>48h)
  const el = document.getElementById('staleBanner'); if (!el) return;
  if (!newest || (Date.now() - newest) < 48 * 3600000) { el.style.display = 'none'; return; }
  el.style.display = 'flex';
  el.textContent = '⚠ ' + t('staleWarn', formatRelativeDate(newestIso));
}

function periodWindows() {
  const now = Date.now();
  if (dateFilter === '1d') { const s = startOfDay(new Date()); return { pf: s - 86400000, pt: s }; }
  if (dateFilter === '7d' || dateFilter === '30d' || dateFilter === '90d') {
    const n = parseInt(dateFilter) * 86400000; return { pf: now - 2 * n, pt: now - n };
  }
  if (dateFilter === 'custom' && customFrom && customTo) {
    const len = customTo - customFrom; return { pf: customFrom - len - 1, pt: customFrom - 1 };
  }
  return null; // 'all': geen vergelijkbare vorige periode
}

function pctDelta(cur, prev) { if (prev > 0) return (cur - prev) / prev * 100; return cur > 0 ? 100 : 0; }

function deltaPill(p) {
  if (p == null || !isFinite(p)) return '';
  const flat = Math.abs(p) < 0.5;
  const cls = flat ? 'flat' : (p > 0 ? 'up' : 'down');
  const arrow = flat ? '=' : (p > 0 ? '▲' : '▼');
  return `<span class="pill ${cls}" title="${t('kpiVsPrev')}">${arrow} ${p > 0 ? '+' : ''}${Math.round(p)}%</span>`;
}

function animateHero() {
  const el = document.getElementById('heroNet'); if (!el) return;
  const target = parseFloat(el.dataset.target || '0');
  const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (_lastHero === null || _lastHero === target || reduce || typeof requestAnimationFrame !== 'function') {
    el.textContent = fmtMoney(target); _lastHero = target; return;
  }
  const from = _lastHero, t0 = performance.now(), dur = 700;
  _lastHero = target;
  const step = (now) => {
    const p = Math.min(1, (now - t0) / dur);
    const e = 1 - Math.pow(1 - p, 3);
    el.textContent = fmtMoney(from + (target - from) * e);
    if (p < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

function applyDateFilter(txs) {
  if (dateFilter === 'all') return txs;
  if (dateFilter === 'custom') {
    if (!customFrom || !customTo) return txs;
    return txs.filter(t => { const x = new Date(t.time).getTime(); return x >= customFrom && x <= customTo; });
  }
  const now = new Date(); let cutoff;
  if (dateFilter === '1d') cutoff = startOfDay(now);
  else if (dateFilter === '7d') cutoff = now.getTime() - 7 * 86400000;
  else if (dateFilter === '30d') cutoff = now.getTime() - 30 * 86400000;
  else if (dateFilter === '90d') cutoff = now.getTime() - 90 * 86400000;
  else return txs;
  return txs.filter(t => new Date(t.time).getTime() >= cutoff);
}

function blossomNorm(s) { return String(s || '').toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim(); }

function blossomIconFor(name) {
  if (!blossomItems) return null;
  const raw = String(name || '').trim().toLowerCase();
  const hit = blossomItems.exact[raw];
  if (hit) return hit;
  // Normalized matching ONLY for decorated names (❀ ✦ ☠ …), so a vanilla
  // item that shares its name with a custom one never gets the wrong icon.
  if (/[^\x20-\x7e]/.test(raw)) return blossomItems.norm[blossomNorm(raw)] || null;
  return null;
}

async function loadBlossomItems() {
  try {
    const cached = loadStorage('qs_blossom_v1', null);
    if (cached && cached.t && (Date.now() - cached.t) < 24 * 3600000 && cached.exact) { blossomItems = cached; return; }
  } catch (e) {}
  const exact = {}, norm = {};
  const pull = async (url, dir, info) => {
    let rows = null;
    try { const r = await fetch(url, { headers: { 'I-INCLUDED-INFO': info } }); if (r.ok) { const j = await r.json(); rows = j && j.data; } } catch (e) {}
    if (!rows) { try { const r = await fetch(url); if (r.ok) { const j = await r.json(); rows = j && j.data; } } catch (e) {} }
    (rows || []).forEach(it => {
      if (!it || !it.ItemName || it.id == null) return;
      const entry = { u: `https://www.blossom.atn.gg/static/images/${dir}/${it.id}.${it.ImageType || 'png'}`, r: it.RarityHuman || null };
      exact[String(it.ItemName).trim().toLowerCase()] = entry;
      const n = blossomNorm(it.ItemName); if (n) norm[n] = entry;
    });
    return !!(rows && rows.length);
  };
  const a = await pull('https://www.blossom.atn.gg/api/items', 'BlossomCraft_Icons', 'id;ItemName;ImageType;RarityHuman');
  const b = await pull('https://www.blossom.atn.gg/api/miscitems', 'BlossomCraft_Misc_Icons', 'id;ItemName;ImageType');
  if (a || b) {
    blossomItems = { t: Date.now(), exact, norm };
    try { saveStorage('qs_blossom_v1', blossomItems); } catch (e) {}
    try { render(); } catch (e) {}
  }
}

function esc(s) { return (s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

function jsStr(s) { return (s || '').replace(/\\/g, '\\\\').replace(/'/g, "\\'"); }

function fmtMoney(n) { return '$' + Math.round(n).toLocaleString('en-US'); }

function fmtNum(n) { return Math.round(n).toLocaleString('en-US'); }

function exportCsv() {
  const rows = transactions;
  if (!rows.length) { showToast(t('exportNone'), 'red'); return; }
  const q = v => { v = String(v == null ? '' : v); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
  const head = ['time', 'buyer', 'item', 'quantity', 'gross', 'tax', 'net', 'shop'];
  const lines = [head.join(',')].concat(rows.map(tx => [
    tx.time, tx.buyer, tx.item, tx.qty,
    Number(tx.gross || 0).toFixed(2), Number(tx.tax || 0).toFixed(2), Number(tx.net || 0).toFixed(2),
    tx.shop
  ].map(q).join(',')));
  const blob = new Blob([lines.join('\n')], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'qs_export_' + new Date().toISOString().slice(0, 10) + '.csv';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  showToast(t('exportDone', rows.length), 'green');
}

function setupPWA() {
  try {
    const icon = (size) => {
      const c = document.createElement('canvas'); c.width = c.height = size;
      const x = c.getContext('2d');
      x.fillStyle = '#07090f'; x.fillRect(0, 0, size, size);
      x.fillStyle = '#8b5cff'; x.textAlign = 'center'; x.textBaseline = 'middle';
      x.font = '700 ' + Math.round(size * 0.34) + 'px "JetBrains Mono", monospace';
      x.fillText('QS', size / 2, size * 0.46);
      x.fillStyle = '#22d3ee'; x.fillRect(size * 0.31, size * 0.63, size * 0.38, Math.max(3, size * 0.045));
      return c.toDataURL('image/png');
    };
    const manifest = {
      name: 'QS·INSIGHTS', short_name: 'QS·INSIGHTS',
      start_url: location.href.split('#')[0], scope: location.href.replace(/[^/]*$/, ''),
      display: 'standalone', background_color: '#0b0f14', theme_color: '#0b0f14',
      icons: [
        { src: icon(192), sizes: '192x192', type: 'image/png', purpose: 'any' },
        { src: icon(512), sizes: '512x512', type: 'image/png', purpose: 'any' },
        { src: icon(512), sizes: '512x512', type: 'image/png', purpose: 'maskable' }
      ]
    };
    const link = document.createElement('link');
    link.rel = 'manifest';
    link.href = 'data:application/manifest+json,' + encodeURIComponent(JSON.stringify(manifest));
    document.head.appendChild(link);
  } catch (e) {}
}

function computeRestock() {
  const combos = buildStockCombos();
  const all = getStockData();
  const perItem = {};
  Object.values(combos).forEach(c => {
    const e = all[c.key];
    if (!e || isShopDeleted(e, c)) return;
    const est = estimateStock(e, c);
    if (est == null) return;
    const full = (e.capacity && e.capacity > 0) ? e.capacity : e.baseline;
    const need = Math.max(0, Math.round((full || 0) - est));
    if (need <= 0) return;
    const o = perItem[c.item] || (perItem[c.item] = { item: c.item, need: 0, shops: 0 });
    o.need += need; o.shops++;
  });
  return Object.values(perItem).sort((a, b) => b.need - a.need);
}

function setEditToken(t) { try { sessionStorage.setItem('qs_edit_token', t); } catch (e) {} }
function clearEditToken() { try { sessionStorage.removeItem('qs_edit_token'); } catch (e) {} }
function getUserName() { return loadStorage('qs_user_name', ''); }
function setUserName(n) { saveStorage('qs_user_name', n); }


function soldSince(baselineTimeIso, combo) {
  const t0 = new Date(baselineTimeIso).getTime();
  let s = 0;
  combo.txs.forEach(t => { if (new Date(t.time).getTime() > t0) s += t.qty; });
  return s;
}

function triggerSync() {
  if (!canWrite()) return; // read-only viewers keep edits local only
  clearTimeout(_syncTimer);
  _syncTimer = setTimeout(pushState, 800);
}

<script>
/* ================ FRESH UI LAYER (v3) ================ */

function dayKey(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function periodLabel() {
  if (dateFilter === 'custom' && customFrom && customTo) {
    const o = { day: 'numeric', month: 'short' };
    return new Date(customFrom).toLocaleDateString(dloc(), o) + ' – ' + new Date(customTo).toLocaleDateString(dloc(), o);
  }
  return { all: t('pAll'), '1d': t('pToday'), '7d': t('p7'), '30d': t('p30'), '90d': t('p90') }[dateFilter] || '';
}
function kpiStats(list) {
  const total = sumNet(list), count = list.length;
  const buyers = new Set(list.map(x => x.buyer)).size;
  return { total, count, buyers, avg: count ? total / count : 0 };
}

/* ---------------- render: kpis + spark ---------------- */
function renderKpis() {
  const hero = document.getElementById('kpiHero'); if (!hero) return;
  if (!analyticsAll.length) {
    hero.innerHTML = `<div class="empty"><div class="fx">✿</div><p><b>${t('emptyTitle')}</b></p><p class="h">${t('emptyHint')}</p></div>`;
    document.getElementById('kpiA').innerHTML = ''; document.getElementById('kpiB').innerHTML = '';
    return;
  }
  const cur = kpiStats(transactions);
  const w = periodWindows(); let d = null;
  if (w) {
    const prev = analyticsAll.filter(tx => { const x = new Date(tx.time).getTime(); return x >= w.pf && x < w.pt; });
    const p = kpiStats(prev);
    d = { net: pctDelta(cur.total, p.total), count: pctDelta(cur.count, p.count), buyers: pctDelta(cur.buyers, p.buyers), avg: pctDelta(cur.avg, p.avg) };
  }
  const t0 = startOfDay(new Date());
  const todayTx = analyticsAll.filter(x => new Date(x.time).getTime() >= t0);
  hero.innerHTML = `
    <div class="eyebrow">✿ ${t('kNet')} · ${esc(periodLabel())}</div>

    <canvas id="spark"></canvas>

  document.getElementById('kpiA').innerHTML =
    `<div class="k-l">${t('kSales')}${d ? deltaPill(d.count) : ''}</div><div class="k-v">${fmtNum(cur.count)}</div><div class="k-s">${d ? t('kpiVsPrev') : ''}</div>
     <div class="divider"></div>
     <div class="k-l">${t('kBuyers')}${d ? deltaPill(d.buyers) : ''}</div><div class="k-v">${fmtNum(cur.buyers)}</div><div class="k-s">${d ? t('kpiVsPrev') : ''}</div>`;
  document.getElementById('kpiB').innerHTML =
    `<div class="k-l">${t('kAvg')}${d ? deltaPill(d.avg) : ''}</div><div class="k-v">${fmtMoney(cur.avg)}</div><div class="k-s">${d ? t('kpiVsPrev') : ''}</div>`;
  drawSpark();
  animateHero();
}
function drawSpark() {
  const cv = document.getElementById('spark');
  if (!cv || !cv.getContext) return;
  const W = cv.width = (cv.clientWidth || 560), H = cv.height = 54;
  const ctx = cv.getContext('2d');
  const days = [...Array(30)].map((_, i) => new Date(startOfDay(new Date()) - (29 - i) * 86400000));
  const map = {};
  analyticsAll.forEach(tx => { const k = String(tx.time).slice(0, 10); map[k] = (map[k] || 0) + tx.net; });
  const vals = days.map(d => map[dayKey(d)] || 0);
  const mx = Math.max(1, ...vals);
  ctx.clearRect(0, 0, W, H);
  const g = ctx.createLinearGradient(0, 0, W, 0); g.addColorStop(0, '#ff7a9e'); g.addColorStop(1, '#ffb057');
  ctx.lineWidth = 2.5; ctx.strokeStyle = g; ctx.lineJoin = 'round';
  ctx.beginPath();
  vals.forEach((v, i) => { const x = i / (vals.length - 1) * (W - 4) + 2; const y = H - 6 - (v / mx) * (H - 14); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); });
  ctx.stroke();
  const g2 = ctx.createLinearGradient(0, 0, 0, H); g2.addColorStop(0, 'rgba(255,122,158,.20)'); g2.addColorStop(1, 'rgba(255,122,158,0)');
  ctx.lineTo(W - 2, H); ctx.lineTo(2, H); ctx.closePath(); ctx.fillStyle = g2; ctx.fill();
}

/* ---------------- render: chart + tops + activity ---------------- */
function renderChart() {
  const cv = document.getElementById('revChart');
  const tt = document.getElementById('chartTitle'); if (tt) tt.textContent = t('sChart');
  if (!cv || !window.Chart) return;
  const days = [...Array(14)].map((_, i) => new Date(startOfDay(new Date()) - (13 - i) * 86400000));
  const map = {};
  analyticsAll.forEach(tx => { const k = String(tx.time).slice(0, 10); map[k] = (map[k] || 0) + tx.net; });
  const vals = days.map(d => map[dayKey(d)] || 0);
  if (_revChart) { try { _revChart.destroy(); } catch (e) {} }
  _revChart = new Chart(cv, {
    type: 'line',
    data: { labels: days.map(d => d.toLocaleDateString(dloc(), { day: 'numeric', month: 'short' })), datasets: [{ data: vals, borderColor: '#ff7a9e', backgroundColor: 'rgba(255,122,158,.14)', fill: true, tension: .35, pointRadius: 0, borderWidth: 2.2 }] },
    options: { plugins: { legend: { display: false } }, maintainAspectRatio: false, scales: { y: { beginAtZero: true, ticks: { maxTicksLimit: 4 } }, x: { grid: { display: false }, ticks: { maxTicksLimit: 7 } } } }
  });
}
function renderTops() {
  const ti = document.getElementById('itemsTitle'); if (ti) ti.innerHTML = `${t('sItems')} <span class="n">· ${esc(periodLabel())}</span>`;
  const tb = document.getElementById('buyersTitle'); if (tb) tb.innerHTML = `${t('sBuyers')} <span class="n">· ${esc(periodLabel())}</span>`;

    const it = items[tx.item] || (items[tx.item] = { item: tx.item, qty: 0, net: 0, count: 0 });

  ).join('') || `<div class="empty"><div class="fx">✿</div><p class="h">${t('rNoMatch')}</p></div>`;
  const topB = Object.values(buyers).sort((a, b) => b.net - a.net).slice(0, 5);
  document.getElementById('topBuyers').innerHTML = topB.map(b =>
    `<div class="li click" onclick="openProfile('${jsStr(b.name)}')">${avatarImg(b.name, 24)}<div class="m"><div class="a">${esc(b.name)}</div><div class="b">${t('buyersMeta', b.count)}</div></div><div class="amt">${fmtMoney(b.net)}</div></div>`
  ).join('') || `<div class="empty"><div class="fx">✿</div><p class="h">${t('rNoMatch')}</p></div>`;

  if (totalCust) document.getElementById('topBuyers').innerHTML += `<button class="btn ghost wide" style="margin-top:10px" onclick="openCustomers()">${t('buyersAll', totalCust)}</button>`;
}
function renderActivity() {
  const tt = document.getElementById('actTitle'); if (tt) tt.textContent = t('sAct');
  const host = document.getElementById('actBox'); if (!host) return;
  if (transactions.length < 3) { host.innerHTML = `<div class="act-line">${t('actNone')}</div>`; return; }
  const dayT = [0, 0, 0, 0, 0, 0, 0], hourT = new Array(24).fill(0);
  transactions.forEach(tx => { const d = new Date(tx.time); dayT[d.getDay()] += tx.net; hourT[d.getHours()] += tx.net; });
  const order = [1, 2, 3, 4, 5, 6, 0];
  const names = lang === 'en' ? ['mo', 'tu', 'we', 'th', 'fr', 'sa', 'su'] : ['ma', 'di', 'wo', 'do', 'vr', 'za', 'zo'];
  const mx = Math.max(1, ...dayT);
  const topDayIdx = order[order.map(i => dayT[i]).indexOf(Math.max(...order.map(i => dayT[i])))];
  const topHour = hourT.indexOf(Math.max(...hourT));
  host.innerHTML = `<div class="abars">${order.map((di, i) =>
    `<div class="ab ${di === topDayIdx ? 'top' : ''}"><i style="height:${Math.max(4, dayT[di] / mx * 62).toFixed(0)}px"></i><s>${names[i]}</s></div>`).join('')}</div>
    <div class="act-line">${t('actBusy', String(topHour).padStart(2, '0') + ':00', names[order.indexOf(topDayIdx)])}</div>`;
}

/* ---------------- ops tiles ---------------- */
function stockAlerts() {
  const combos = buildStockCombos(); const all = getStockData();
  let low = 0, urgent = 0, tracked = 0;
  Object.values(combos).forEach(c => {
    const e = all[c.key]; if (!e || isShopDeleted(e, c)) return;
    const est = estimateStock(e, c); if (est == null) return;
    tracked++;
    const cap = (e.capacity && e.capacity > 0) ? e.capacity : (e.baseline || 0);
    const pct = cap > 0 ? est / cap : 1;
    if (est <= 0 || pct <= 0.1) urgent++; else if (pct <= 0.3) low++;
  });
  return { low, urgent, tracked };
}
function loanCounts() {
  const ls = activeLoans(); let a = 0, o = 0;
  ls.forEach(l => { const s = loanStatus(l); if (s === 'overdue') o++; else if (s === 'active') a++; });
  return { a, o };
}
function updateOpsTiles() {
  const tt = document.getElementById('opsTitle'); if (tt) tt.textContent = t('opsTitle');
  const host = document.getElementById('opsBox'); if (!host) return;
  const st = stockAlerts(); const ln = loanCounts();
  const stLine = !st.tracked ? `<span>${t('opsNoTrack')}</span>`
    : (st.urgent + st.low) ? `<span style="color:var(--rose);font-weight:800">${t('opsLow', st.urgent + st.low)}</span>`
    : `<span style="color:var(--mint);font-weight:800">${t('opsOk')}</span>`;
  const lnLine = (!ln.a && !ln.o) ? `<span>${t('opsNone')}</span>`
    : `<span>${t('opsOpen', ln.a)}</span>${ln.o ? ` · <span style="color:var(--rose);font-weight:800">${t('opsLate', ln.o)}</span>` : ''}`;
  host.innerHTML = `
    <button class="opbtn" onclick="openStock()"><span class="ic">📦</span><span class="tx"><span class="a">${t('opsStock')}</span><span class="b">${stLine}</span></span><span class="go">›</span></button>
    <button class="opbtn" onclick="openLoans()"><span class="ic">🤝</span><span class="tx"><span class="a">${t('opsLoans')}</span><span class="b">${lnLine}</span></span><span class="go">›</span></button>`;
}

      <div><div class="k-l">${t('prAvg')}</div><div class="k-v" style="font-size:22px">${fmtMoney(total / mine.length)}</div></div>
    </div>

    ${myLoans.length ? `<div class="divider"></div><div class="tt">${t('prLoans')} <span class="n">· ${myLoans.length}</span></div>` +

    <div class="divider"></div>
    <div class="tt">${t('prRecent')}</div>
    ${mine.slice(0, 5).map(tx => `<div class="li">${itemIcon(tx.item, 24)}<div class="m"><div class="a">${fmtNum(tx.qty)}× ${esc(tx.item)}</div><div class="b">${formatRelativeDate(tx.time)}</div></div><div class="amt">${fmtMoney(tx.net)}</div></div>`).join('')}
    <div class="s-foot"><button class="btn ghost" onclick="closeSheet('profileSheet')">${t('close')}</button></div>`;

<script>
/* ---------------- stock sheet ---------------- */
function openStock() { ensureStockSkeleton(); renderStockSheet(); openSheet('stockSheet'); }
function ensureStockSkeleton() {
  const b = document.getElementById('stockBody'); if (!b || b.dataset.ready) return; b.dataset.ready = '1';
  b.innerHTML = `<h3>📦 <span id="stTitle"></span></h3>
    <div style="display:flex;gap:8px;margin:6px 0 8px"><input class="search" style="margin:0;flex:1" id="stockSearch" oninput="_stockQ=this.value;renderStockList()" /><button class="btn sm" id="stRestockBtn" onclick="openRestock()"></button></div>
    <div id="stNote" class="desc"></div><div id="stockList"></div>
    <div class="s-foot"><button class="btn ghost" id="stClose" onclick="closeSheet('stockSheet')"></button></div>`;
}
function renderStockSheet() {
  ensureStockSkeleton();
  const st = document.getElementById('stTitle'); if (!st) return;
  st.textContent = t('stTitle');
  document.getElementById('stockSearch').placeholder = t('stSearch');
  document.getElementById('stRestockBtn').textContent = t('stRestock');
  document.getElementById('stClose').textContent = t('close');
  document.getElementById('stNote').textContent = canWrite() ? '' : t('stLockedNote');
  renderStockList();
}
function renderStockList() {
  const host = document.getElementById('stockList'); if (!host) return;
  const combos = buildStockCombos(); const all = getStockData(); const unlocked = canWrite();
  const q = _stockQ.trim().toLowerCase();
  let list = Object.values(combos).filter(c => !isShopDeleted(all[c.key], c));
  if (q) list = list.filter(c => c.item.toLowerCase().includes(q) || c.coords.toLowerCase().includes(q));
  const rank = c => { const e = all[c.key]; const est = e ? estimateStock(e, c) : null; if (est == null) return 3;
    const cap = (e.capacity && e.capacity > 0) ? e.capacity : (e.baseline || 0); const p = cap > 0 ? est / cap : 1;
    return (est <= 0 || p <= 0.1) ? 0 : (p <= 0.3 ? 1 : 2); };
  list.sort((a, b) => rank(a) - rank(b) || a.item.localeCompare(b.item));
  host.innerHTML = list.map(c => {
    const e = all[c.key]; const est = e ? estimateStock(e, c) : null;
    const cap = e && e.capacity > 0 ? e.capacity : (e && e.baseline) || 0;
    const r = rank(c); const cls = r === 0 ? 'urgent' : r === 1 ? 'low' : '';
    const pct = (est != null && cap > 0) ? Math.min(100, est / cap * 100) : 0;
    const conf = e && e.baseline != null ? stockConfidence(e) : null;
    return `<div class="scard ${cls}">
      <div class="s-top">${itemIcon(c.item, 26)}
        <div class="s-info"><div class="s-name">${esc(c.item)}${blossomBadge(c.item)}</div><div class="s-co mono">@ ${esc(c.coords)}</div></div>
        <div class="s-est"><div class="s-num ${cls}">${est == null ? '—' : fmtNum(est)}</div><div class="s-cap">${cap ? '/ ' + fmtNum(cap) : t('stNoBase')}</div></div></div>
      ${est != null && cap ? `<div class="bar"><i style="width:${pct.toFixed(0)}%"></i></div>` : ''}
      <div class="s-meta">${conf ? `<span class="chip ${conf.cls}">${conf.label}</span>` : ''}${e && e.lastBy ? `<span>${esc(t('stBy', e.lastBy))}</span>` : ''}${e && e.baselineTime ? `<span>${formatRelativeDate(e.baselineTime)}</span>` : ''}</div>
      ${unlocked ? `<div class="s-act">
        <button class="btn sm" onclick="stAsk('${jsStr(c.key)}','fill')">${t('stFill')}</button>
        <button class="btn sm ghost" onclick="stFull('${jsStr(c.key)}')">${t('stFull')}</button>
        <button class="btn sm ghost" onclick="stAsk('${jsStr(c.key)}','cap')">${t('stCap')}</button>
        <button class="btn sm danger" onclick="stDelete('${jsStr(c.key)}')">🗑</button></div>` : ''}
    </div>`;
  }).join('') || `<div class="empty"><div class="fx">📦</div><p class="h">${t('rNoMatch')}</p></div>`;
}
function stockSet(key, patch) {
  const all = getStockData(); const e = all[key] || {};
  all[key] = { ...e, ...patch };
  saveStockData(all); triggerSync();
  renderStockList(); updateOpsTiles();
}
function stAsk(key, mode) {
  if (!ensureUnlocked()) return;
  const c = buildStockCombos()[key]; if (!c) return;
  const e = getStockData()[key] || {};
  if (mode === 'fill') {
    promptOpen({ title: t('stFillTitle'), desc: t('stFillDesc', c.item), type: 'number', value: e.capacity || e.baseline || 64, ok: t('save'), onOk: v => {
      v = Math.round(v); if (v < 0) return t('errNum');
      stockSet(key, { baseline: v, baselineTime: new Date().toISOString(), capacity: Math.max(v, e.capacity || 0), lastType: 'fill', lastBy: getUserName() || '' });
    }});
  } else {
    promptOpen({ title: t('stCapTitle'), desc: t('stCapDesc'), type: 'number', value: e.capacity || 64, ok: t('save'), onOk: v => {
      v = Math.round(v); if (v <= 0) return t('errNum');
      stockSet(key, { capacity: v });
    }});
  }
}
function stFull(key) {
  if (!ensureUnlocked()) return;
  const e = getStockData()[key] || {};
  const doFull = cap => stockSet(key, { baseline: cap, baselineTime: new Date().toISOString(), capacity: cap, lastType: 'fill', lastBy: getUserName() || '' });
  if (e.capacity > 0) doFull(e.capacity);
  else promptOpen({ title: t('stCapTitle'), desc: t('stCapDesc'), type: 'number', value: 64, ok: t('save'), onOk: v => { v = Math.round(v); if (v <= 0) return t('errNum'); doFull(v); } });
}
function stDelete(key) {
  if (!ensureUnlocked()) return;
  const c = buildStockCombos()[key]; if (!c) return;
  promptOpen({ title: t('stDelTitle'), desc: t('stDelDesc', c.item), type: 'text', ok: t('yes'), onOk: v => {
    if (String(v).trim().toLowerCase() !== 'delete') return t('delType');
    stockSet(key, { deletedAt: new Date().toISOString() });
  }});
}

/* ---------------- restock ---------------- */
function openRestock() { renderRestockSheet(); openSheet('restockSheet'); }
function renderRestockSheet() {
  const b = document.getElementById('restockBody'); if (!b) return;
  const list = computeRestock();
  const stacksTxt = need => { const s = Math.floor(need / 64), r = need % 64; return s > 0 ? t('rsStacks', s, r) : ''; };
  b.innerHTML = `<h3>📋 ${t('rsTitle')}</h3><p class="desc">${t('rsDesc')}</p>` +
    (list.length ? list.map(o => `<div class="li">${itemIcon(o.item, 24)}<div class="m"><div class="a">${esc(o.item)}</div><div class="b">${t('rsShops', o.shops)}${stacksTxt(o.need) ? ' · ' + stacksTxt(o.need) : ''}</div></div><div class="amt" style="color:var(--peach)">${t('rsPieces', fmtNum(o.need))}</div></div>`).join('') +
      `<div class="s-foot"><button class="btn ghost" onclick="closeSheet('restockSheet')">${t('close')}</button><button class="btn" onclick="copyRestock()">${t('rsCopy')}</button></div>`
    : `<div class="empty"><div class="fx">✅</div><p>${t('rsNone')}</p></div><div class="s-foot"><button class="btn ghost" onclick="closeSheet('restockSheet')">${t('close')}</button></div>`);
}
function copyRestock() {
  const list = computeRestock();
  const lines = list.map(o => { const s = Math.floor(o.need / 64), r = o.need % 64; return `${o.need}x ${o.item}` + (s > 0 ? ` (${s}s${r ? '+' + r : ''})` : ''); });
  const text = lines.join('\n');
  const done = () => showToast(t('rsCopied'), 'green');
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done).catch(() => fallbackCopy(text, done));
  else fallbackCopy(text, done);
}
function fallbackCopy(text, done) {
  const ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); done(); } catch (e) {} ta.remove();
}

/* ---------------- loans ---------------- */
function openLoans() { ensureLoanSkeleton(); renderLoanSheet(); openSheet('loanSheet'); }
function ensureLoanSkeleton() {
  const b = document.getElementById('loanBody'); if (!b || b.dataset.ready) return; b.dataset.ready = '1';
  b.innerHTML = `<h3>🤝 <span id="lnTitle"></span><button class="btn sm" style="margin-left:auto" id="lnAddBtn" onclick="openLoanForm()"></button></h3>
    <div id="loanList"></div>
    <div class="s-foot"><button class="btn ghost" id="lnClose" onclick="closeSheet('loanSheet')"></button></div>`;
}
function renderLoanSheet() {
  ensureLoanSkeleton();
  const el = document.getElementById('lnTitle'); if (!el) return;
  el.textContent = t('lnTitle');
  document.getElementById('lnAddBtn').textContent = t('lnAdd');
  document.getElementById('lnClose').textContent = t('close');
  const host = document.getElementById('loanList');
  const all = activeLoans();
  const overdue = all.filter(l => loanStatus(l) === 'overdue');
  const act = all.filter(l => loanStatus(l) === 'active');
  const ret = all.filter(l => loanStatus(l) === 'returned').sort((a, b) => new Date(b.returnedAt) - new Date(a.returnedAt)).slice(0, 8);
  const sec = (title, color, arr) => arr.length ? `<div class="lsec"><h4><span class="d" style="background:${color}"></span>${title} · ${arr.length}</h4>${arr.map(loanCard).join('')}</div>` : '';
  host.innerHTML = (overdue.length + act.length + ret.length)
    ? sec(t('lnOverdue'), 'var(--rose)', overdue) + sec(t('lnActive'), 'var(--mint)', act) + sec(t('lnReturned'), 'var(--ink3)', ret)
    : `<div class="empty"><div class="fx">🤝</div><p>${t('lnNone')}</p></div>`;
}
function loanCard(l) {
  const s = loanStatus(l); const unlocked = canWrite();
  const due = loanDueMs(l);
  const dueTxt = new Date(due).toLocaleDateString(dloc(), { day: 'numeric', month: 'short' });
  let stTxt = '', stCls = '';
  if (s === 'returned') stTxt = t('lnRet', new Date(l.returnedAt).toLocaleDateString(dloc(), { day: 'numeric', month: 'short' }));
  else if (s === 'overdue') { stTxt = t('lnLate', Math.max(1, Math.ceil((Date.now() - due) / 86400000))); stCls = 'late'; }
  else stTxt = t('lnDays', Math.max(0, Math.ceil((due - Date.now()) / 86400000)));
  return `<div class="lcard ${s}">
    <div class="l-top">${avatarImg(l.borrower, 24)}<div class="l-who">${esc(l.borrower)}</div>${Number(l.amount) > 0 ? `<div class="l-amt">${fmtMoney(Number(l.amount))}</div>` : ''}</div>
    <div class="l-item">${itemIcon(l.item, 22)} ${fmtNum(l.qty || 1)}× ${esc(l.item)}${blossomBadge(l.item)}</div>
    <div class="l-line"><span class="st ${stCls}">${stTxt}</span><span>${s !== 'returned' ? t('lnDue', dueTxt) : ''}${l.by ? ' · ' + esc(t('lnBy', l.by)) : ''}</span></div>
    ${l.note ? `<div class="l-note">${esc(l.note)}</div>` : ''}
    ${unlocked ? `<div class="l-act">` +
      (s === 'returned'
        ? `<button class="btn sm ghost" onclick="loanReopen('${jsStr(l.id)}')">${t('lnReopen')}</button>`
        : `<button class="btn sm" onclick="loanReturn('${jsStr(l.id)}')">${t('lnReturn')}</button><button class="btn sm ghost" onclick="loanExtend('${jsStr(l.id)}')">${t('lnExtend')}</button>`) +
      `<button class="btn sm danger" onclick="loanDelete('${jsStr(l.id)}')">🗑</button></div>` : ''}
  </div>`;
}
function loanReturn(id) { if (!ensureUnlocked()) return; _updateLoan(id, { returnedAt: new Date().toISOString() }); renderLoanSheet(); updateOpsTiles(); }
function loanReopen(id) { if (!ensureUnlocked()) return; _updateLoan(id, { returnedAt: null }); renderLoanSheet(); updateOpsTiles(); }
function loanExtend(id) {
  if (!ensureUnlocked()) return;
  const l = getLoans().find(x => x.id === id); if (!l) return;
  promptOpen({ title: t('lnExtTitle'), desc: t('lnExtDesc', l.item, l.borrower), type: 'number', value: 7, ok: t('lnExtend'), onOk: v => {
    v = Math.round(v); if (v <= 0) return t('errNum');
    _updateLoan(id, { days: (Number(l.days) || 0) + v });
    const nd = new Date(loanDueMs({ ...l, days: (Number(l.days) || 0) + v })).toLocaleDateString(dloc(), { day: 'numeric', month: 'short' });
    showToast(t('lnExtDone', nd), 'green');
    renderLoanSheet(); updateOpsTiles();
  }});
}
function loanDelete(id) {
  if (!ensureUnlocked()) return;
  const l = getLoans().find(x => x.id === id); if (!l) return;
  confirmOpen({ desc: t('lnDelDesc', l.item, l.borrower), onYes: () => { _updateLoan(id, { del: true }); renderLoanSheet(); updateOpsTiles(); } });
}
function openLoanForm() {
  if (!ensureUnlocked()) return;
  const b = document.getElementById('loanFormBody');
  b.innerHTML = `<h3>${t('lnAdd')}</h3>
    <label>${t('lnFBorrower')}</label><input class="in" id="lfB" />
    <label>${t('lnFItem')}</label><input class="in" id="lfI" />
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
      <div><label>${t('lnFQty')}</label><input class="in" id="lfQ" type="number" inputmode="numeric" value="1" /></div>
      <div><label>${t('lnFAmount')}</label><input class="in" id="lfA" type="number" inputmode="numeric" value="0" /></div>
    </div>
    <label>${t('lnFDays')}</label><input class="in" id="lfD" type="number" inputmode="numeric" value="7" oninput="loanDuePrev()" />
    <div class="desc" id="lfDue"></div>
    <label>${t('lnFNote')}</label><input class="in" id="lfN" />
    <div class="err" id="lfErr"></div>
    <div class="s-foot"><button class="btn ghost" onclick="closeSheet('loanForm')">${t('cancel')}</button><button class="btn" onclick="loanSubmit()">${t('lnSave')}</button></div>`;
  loanDuePrev();
  openSheet('loanForm');
}
function loanDuePrev() {
  const d = parseInt((document.getElementById('lfD') || {}).value, 10);
  const el = document.getElementById('lfDue'); if (!el) return;
  el.textContent = (d > 0) ? t('lnDuePrev', new Date(Date.now() + d * 86400000).toLocaleDateString(dloc(), { weekday: 'short', day: 'numeric', month: 'short' })) : '';
}
function loanSubmit() {
  const g = id => (document.getElementById(id) || {}).value || '';
  const borrower = g('lfB').trim(), item = g('lfI').trim();
  const qty = Math.max(1, Math.round(parseFloat(g('lfQ')) || 1));
  const amount = Math.max(0, parseFloat(g('lfA')) || 0);
  const days = Math.round(parseFloat(g('lfD')) || 0);
  const note = g('lfN').trim();
  if (!borrower || !item || days <= 0) { document.getElementById('lfErr').textContent = t('lnErr'); return; }
  const now = new Date().toISOString();
  const loan = { id: 'l' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6), borrower, item, qty, amount, days, note, start: now, returnedAt: null, by: getUserName() || '', mod: now };
  saveLoans([...getLoans(), loan]); triggerSync();
  closeSheet('loanForm'); renderLoanSheet(); updateOpsTiles();
}
</script>

<script>
/* ---------------- unlock / lock / admin ---------------- */
function openUnlock() {
  const b = document.getElementById('unlockBody');
  b.innerHTML = `<h3>🔓 ${t('ulTitle')}</h3><p class="desc">${t('ulDesc')}</p>
    <label>${t('ulName')}</label><input class="in" id="ulName" value="${esc(getUserName() || '')}" />
    <label>${t('ulPass')}</label><input class="in" id="ulPass" type="password" onkeydown="if(event.key==='Enter')unlockSubmit()" />
    <div class="err" id="ulErr"></div>
    <div class="s-foot"><button class="btn ghost" onclick="closeSheet('unlockSheet')">${t('cancel')}</button><button class="btn" onclick="unlockSubmit()">${t('ulGo')}</button></div>`;
  openSheet('unlockSheet');
  setTimeout(() => { const i = document.getElementById(getUserName() ? 'ulPass' : 'ulName'); if (i && i.focus) i.focus(); }, 60);
}
async function unlockSubmit() {
  const name = ((document.getElementById('ulName') || {}).value || '').trim();
  const pass = (document.getElementById('ulPass') || {}).value || '';
  const err = document.getElementById('ulErr');
  if (!name || !pass) { err.textContent = t('lnErr'); return; }
  let auth = null;
  try { auth = await readPublicJson('qs_auth.json'); } catch (e) {}
  if (!auth || !auth.ct) { err.textContent = t('ulNoAuth'); return; }
  let token = '';
  try { token = await decryptToken(auth, pass); } catch (e) { err.textContent = t('ulWrong'); return; }
  setEditToken(token); setUserName(name);
  closeSheet('unlockSheet');
  updateLockUI(); render(); rerenderOpenSheets();
  showToast(t('ulHi', name), 'green');
}
function toggleLock() { if (canWrite()) doLock(); else openUnlock(); }
function doLock() { clearEditToken(); updateLockUI(); render(); rerenderOpenSheets(); showToast(t('lockDone')); }
function updateLockUI() {
  const b = document.getElementById('lockBtn'); if (!b) return;
  if (canWrite()) { b.textContent = '🔓 ' + (getUserName() || ''); b.classList.add('on'); }
  else { b.textContent = '🔒 ' + t('lockView'); b.classList.remove('on'); }
}

/* ---------------- settings ---------------- */
function openSettings() { renderSettings(); openSheet('settingsSheet'); }
function renderSettings() {
  const b = document.getElementById('settingsBody'); if (!b) return;
  const th = document.documentElement.getAttribute('data-theme') || 'dark';
  b.innerHTML = `<h3>⚙ ${t('seTitle')}</h3>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:8px">
      <div><label>${t('seLang')}</label><div style="display:flex;gap:6px;margin-top:5px">
        <button class="ib ${lang === 'nl' ? 'on' : ''}" onclick="setLang('nl')">Nederlands</button>
        <button class="ib ${lang === 'en' ? 'on' : ''}" onclick="setLang('en')">English</button></div></div>
      <div><label>${t('seTheme')}</label><div style="display:flex;gap:6px;margin-top:5px">
        <button class="ib ${th === 'dark' ? 'on' : ''}" onclick="setTheme('dark')">☾ ${t('seThemeD')}</button>
        <button class="ib ${th === 'light' ? 'on' : ''}" onclick="setTheme('light')">☀ ${t('seThemeL')}</button></div></div>
    </div>
    <div class="divider"></div>
    <p class="desc">${t('seExport')}</p><button class="btn ghost" onclick="exportCsv()">${t('seExportBtn')}</button>
    <div class="divider"></div>
    <p class="desc">${t('sePwa')}</p>
    <div class="divider"></div>
    <label>${t('seAdmin')}</label><p class="desc">${t('seAdminDesc')}</p>
    <label>${t('seToken')}</label><input class="in" id="adTok" type="password" />
    <label>${t('sePass')}</label><input class="in" id="adPass" type="password" />
    <div class="err" id="adErr"></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn" onclick="adminSave()">${t('seSave')}</button>
      ${canWrite() ? `<button class="btn ghost" onclick="doLock()">${t('seLock')}</button>` : ''}
    </div>
    <div class="s-foot"><button class="btn ghost" onclick="closeSheet('settingsSheet')">${t('close')}</button></div>`;
}
async function adminSave() {
  const tok = (document.getElementById('adTok') || {}).value || '';
  const pass = (document.getElementById('adPass') || {}).value || '';
  const err = document.getElementById('adErr');
  if (!tok.trim() || !pass) { err.textContent = t('lnErr'); return; }
  try {
    const blob = await encryptToken(tok.trim(), pass);
    setEditToken(tok.trim());
    await writeJson('qs_auth.json', blob, 'set edit password');
    updateLockUI(); render();
    showToast(t('seSaved'), 'green');
  } catch (e) { err.textContent = t('syncFailed', e.message || e); }
}

/* ---------------- language / theme / periods ---------------- */
function setLang(l) {
  lang = l; saveStorage('qs_lang', l);
  const b = document.getElementById('langBtn'); if (b) b.textContent = l === 'nl' ? 'EN' : 'NL';
  applyStatic(); render(); rerenderOpenSheets();
}
function toggleLang() { setLang(lang === 'nl' ? 'en' : 'nl'); }
function setTheme(v) {
  document.documentElement.setAttribute('data-theme', v);
  saveStorage('qs_theme', v);
  const b = document.getElementById('themeBtn'); if (b) b.textContent = v === 'dark' ? '☀' : '☾';
  if (sheetOpen('settingsSheet')) renderSettings();
  renderChart();
}
function toggleTheme() { setTheme((document.documentElement.getAttribute('data-theme') || 'dark') === 'dark' ? 'light' : 'dark'); }
function setDateFilter(f) {
  dateFilter = f;
  transactions = applyDateFilter(analyticsAll);
  document.querySelectorAll('.pf').forEach(b => b.classList.toggle('on', b.dataset.r === f));
  render();
}
function openRange() {
  const b = document.getElementById('rangeBody');
  const iso = ms => ms ? new Date(ms).toISOString().slice(0, 10) : '';
  b.innerHTML = `<h3>${t('rangeTitle')}</h3>
    <label>${t('rangeFrom')}</label><input class="in" id="rgF" type="date" value="${iso(customFrom)}" />
    <label>${t('rangeTo')}</label><input class="in" id="rgT" type="date" value="${iso(customTo)}" />
    <div class="err" id="rgErr"></div>
    <div class="s-foot"><button class="btn ghost" onclick="closeSheet('rangeSheet')">${t('cancel')}</button><button class="btn" onclick="rangeApply()">${t('rangeApply')}</button></div>`;
  openSheet('rangeSheet');
}
function rangeApply() {
  const f = new Date((document.getElementById('rgF') || {}).value);
  const tt = new Date((document.getElementById('rgT') || {}).value);
  if (isNaN(f) || isNaN(tt) || f > tt) { document.getElementById('rgErr').textContent = t('rangeErr'); return; }
  customFrom = new Date(f.getFullYear(), f.getMonth(), f.getDate()).getTime();
  customTo = new Date(tt.getFullYear(), tt.getMonth(), tt.getDate(), 23, 59, 59).getTime();
  closeSheet('rangeSheet');
  setDateFilter('custom');
}
function applyStatic() {
  const map = { '1d': 'pToday', '7d': 'p7', '30d': 'p30', '90d': 'p90', all: 'pAll', custom: 'pCustom' };
  document.querySelectorAll('.pf').forEach(b => { b.textContent = t(map[b.dataset.r] || ''); });
  const set = (id, v) => { const el = document.getElementById(id); if (el) el.textContent = v; };
  set('tagline', '✿ ' + t('tagline'));
  set('exportBtn', t('seExportBtn'));
  set('bn1', t('bnHome')); set('bn2', t('bnStock')); set('bn3', t('bnLoans')); set('bn4', t('bnRecent'));
  const rs = document.getElementById('recentSearch'); if (rs) rs.placeholder = t('rSearch');
  updateLockUI();
}
